<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme:dark">
<head>
<meta charset="utf-8">
<title>gap harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Nunito+Sans:opsz,wght@6..12,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./bundle.css">
<style>
  body { --font-friendly-display: "Fraunces"; --font-friendly-sans: "Nunito Sans"; }
</style>
</head>
<body class="antialiased">
<div class="app-shell">
  <aside class="sidebar"></aside>
  <main class="workspace">

    <div class="exam-planner">
      <section class="review-panel" id="EXAMPANEL">
        <div class="section-heading">
          <h3>Your exams</h3>
          <button class="primary-button">Plan an exam</button>
        </div>
        <ul class="exam-list">
          <li class="exam-card">
            <div class="exam-head">
              <div class="exam-title">
                <i class="subject-pin slate" aria-hidden="true"></i>
                <div>
                  <strong>Stats</strong>
                  <small>Mathematics · A2 · 12 June 2026</small>
                </div>
              </div>
              <div class="exam-countdown">
                <strong>282 days</strong>
                <small>14 topics</small>
              </div>
            </div>
          </li>
          <li class="exam-card"><div class="exam-head"><div class="exam-title"><i class="subject-pin blue"></i><div><strong>Paper 2</strong><small>Physics · A2 · 3 June 2026</small></div></div><div class="exam-countdown"><strong>273 days</strong><small>9 topics</small></div></div></li>
        </ul>
      </section>
    </div>

    <div class="goals-page grades-page">
      <section class="grade-ladder panel-card" id="LADDER">
        <div class="section-heading">
          <div><p class="eyebrow">EVERY GRADE, PRICED</p><h3>What each one costs you in the exam</h3></div>
          <span>Pick one to make it your target</span>
        </div>
        <ul>
          <li class="reachable chosen">
            <button type="button" aria-pressed="true">
              <span class="grade-badge teal">A*</span>
              <b>90% overall</b>
              <div class="grade-need-bar"><i style="width:88%"></i><em style="left:61%"></em></div>
              <strong>88%</strong>
              <small>27 points off your form</small>
            </button>
          </li>
          <li class="reachable">
            <button type="button">
              <span class="grade-badge blue">A</span>
              <b>80% overall</b>
              <div class="grade-need-bar"><i style="width:74%"></i><em style="left:61%"></em></div>
              <strong>74%</strong>
              <small>13 points off your form</small>
            </button>
          </li>
        </ul>
        <p class="grade-ladder-note">Boundaries move between sessions, so these are estimates.</p>
      </section>
    </div>

  </main>
</div>
</body>
</html>
